name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - run: mkdir -p src/main/resources/META-INF/resources && cp -R web/dist/. src/main/resources/META-INF/resources/ && mvn -B package
      - run: python3 scripts/check-java-lock.py
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: python3 tests/e2e.py
      # Actual Corridora RUM correlation is tested with an operator-provided local RUM_BUNDLE_PATH.
      # The public CI journey without that bundle intentionally does not claim CLIENT/SERVER proof.
