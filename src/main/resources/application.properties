quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:4107}
quarkus.http.limits.max-body-size=128K
quarkus.log.console.json=false
quarkus.http.access-log.enabled=false
quarkus.banner.enabled=false
quarkus.http.header."Cache-Control".value=no-store
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Content-Security-Policy".value=${SAMPLE_CSP:default-src 'self'; script-src 'self' https://rum.corridora.com; connect-src 'self' https://ingest.corridora.com; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'}
